<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Depth runner</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #12171c;
      color: #243038;
      font-family: "Segoe UI", system-ui, sans-serif;
    }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
    }
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 8 / 9));
      height: min(100vh, calc(100vw * 9 / 8));
      touch-action: none;
      user-select: none;
      background: #12171c;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }
    .top, .bottom {
      position: absolute;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .top { top: 14px; }
    .bottom { bottom: 14px; align-items: flex-end; }
    .panel {
      background: rgba(255, 252, 247, 0.92);
      border-radius: 14px;
      padding: 10px 12px;
      box-shadow: 0 8px 22px rgba(36, 48, 56, 0.14);
      max-width: 420px;
    }
    h1 { margin: 0; font-size: 16px; }
    p { margin: 3px 0 0; font-size: 13px; line-height: 1.35; color: #3c4b53; }
    .pill {
      background: rgba(20, 28, 32, 0.5);
      color: white;
      border-radius: 999px;
      padding: 7px 11px;
      font-size: 13px;
      font-weight: 700;
    }
    .nudge {
      position: absolute;
      width: 46px;
      height: 46px;
      margin-top: -23px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: white;
      font-size: 26px;
      background: rgba(20, 28, 32, 0.2);
    }
    .nudge.upper { top: 25%; }
    .nudge.lower { top: 75%; }
    .nudge.left { left: 12px; }
    .nudge.right { right: 12px; }
    .speed {
      position: absolute;
      left: 16px;
      top: calc(50% + 16px);
      display: flex;
      gap: 2px;
      padding: 3px;
      border-radius: 999px;
      background: rgba(20, 28, 32, 0.55);
      pointer-events: auto;
    }
    .speed button {
      border: 0;
      background: transparent;
      color: white;
      font: 700 13px "Segoe UI", system-ui, sans-serif;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }
    .speed button.on { background: white; color: #1c2428; }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game"></canvas>
    <div id="hud">
      <div class="top">
        <div class="panel">
          <h1>Two spawn modes</h1>
          <p>Same items and the same still road. Top steps the items down the screen in even jumps. Bottom brings them in from the horizon, small at first, then larger as they reach the pin.</p>
        </div>
      </div>
      <div class="nudge left upper" aria-hidden="true">‹</div>
      <div class="nudge right upper" aria-hidden="true">›</div>
      <div class="nudge left lower" aria-hidden="true">‹</div>
      <div class="nudge right lower" aria-hidden="true">›</div>
      <div class="speed" id="speed" role="group" aria-label="Run speed">
        <button type="button" data-speed="1" class="on">1×</button>
        <button type="button" data-speed="1.5">1.5×</button>
        <button type="button" data-speed="2">2×</button>
      </div>
      <div class="bottom">
        <div class="pill" id="distance">0 m</div>
        <div class="pill" id="haul">Coins 0 · Suns 0</div>
        <div class="pill" id="bumps">Bumps 0</div>
      </div>
    </div>
  </div>
  <script>
    const NEAR = 420;
    const SEG = 56;
    const VIEW_Z = 2300;
    const SPEED = 520;
    const PLAYER_Z = 90;
    const LANES = [-0.64, 0, 0.64];
    const SIZE = { sun: 240, bat: 203, coin: 99 };

    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const art = {
      coin: Object.assign(new Image(), { src: "coin.png" }),
      sun: Object.assign(new Image(), { src: "sun.png" }),
      bat: Object.assign(new Image(), { src: "bat.png" }),
    };

    let stageW = 1;
    let stageH = 1;
    let width = 1;
    let height = 1;
    let horizonY = 0;
    let groundY = 0;
    let viewMode = "world";
    let cameraZ = 0;
    let nextZ = 640;
    let lane = 1;
    let playerNx = 0;
    let hits = 0;
    let coins = 0;
    let suns = 0;
    let invuln = 0;
    let speedMul = 1;
    let speedScale = 1;
    let runPhase = 0;
    let entities = [];
    let clouds = [];
    let lastPattern = "";
    let lastSafe = -1;

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function mod(a, b) { return ((a % b) + b) % b; }
    function hash(n) {
      let x = Math.imul(n | 0, 374761393);
      x = Math.imul(x ^ (x >>> 13), 1274126177);
      return ((x ^ (x >>> 16)) >>> 0) / 4294967296;
    }

    function project(nx, z) {
      let s;
      if (viewMode === "screen") {
        const farS = NEAR / (NEAR + VIEW_Z);
        const pinS = NEAR / (NEAR + PLAYER_Z);
        const t = clamp((VIEW_Z - z) / (VIEW_Z - PLAYER_Z), 0, 1.08);
        s = farS + (pinS - farS) * t;
      } else {
        s = NEAR / (NEAR + Math.max(0.001, z));
      }
      return {
        x: width * 0.5 + nx * width * 0.52 * s,
        y: horizonY + (groundY - horizonY) * s,
        s: Math.max(0.001, s),
      };
    }

    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      width = stageW = Math.max(1, canvas.clientWidth);
      height = stageH = Math.max(1, canvas.clientHeight);
      canvas.width = Math.round(stageW * dpr);
      canvas.height = Math.round(stageH * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!clouds.length) {
        clouds = [
          { x: 0.12, y: 0.1, r: 26, s: 1 },
          { x: 0.38, y: 0.16, r: 16, s: 0.8 },
          { x: 0.72, y: 0.08, r: 30, s: 1.05 },
          { x: 0.9, y: 0.18, r: 18, s: 0.75 },
        ];
      }
    }

    const MIN_ON_SCREEN = 5;

    function pickSafe(z) {
      let safe = Math.floor(hash(z + 1) * 3);
      if (safe === lastSafe) safe = (safe + 1 + Math.floor(hash(z + 4) * 2)) % 3;
      lastSafe = safe;
      return safe;
    }

    function choosePattern(z, forceObstacle) {
      let pattern;
      if (forceObstacle) pattern = lastPattern === "gate" ? "split" : "gate";
      else {
        const roll = hash(z);
        pattern = roll < 0.48 ? "gate" : roll < 0.82 ? "split" : "pair";
        if (pattern === lastPattern && hash(z + 21) > 0.45) {
          pattern = pattern === "gate" ? "split" : pattern === "split" ? "gate" : "split";
        }
      }
      lastPattern = pattern;
      return pattern;
    }

    function beat(z, forceObstacle) {
      const pattern = choosePattern(z, forceObstacle);
      const items = [];
      let advance = 520;
      if (pattern === "gate" || pattern === "split") {
        const safe = pickSafe(z);
        const blocked = [0, 1, 2].filter((id) => id !== safe);
        const laneA = blocked[Math.floor(hash(z + 8) * blocked.length)];
        const laneB = blocked.find((id) => id !== laneA);
        if (pattern === "gate") {
          const batLanes = blocked;
          batLanes.forEach((id) => items.push({ z, lane: id, kind: "bat" }));
          const reward = hash(z + 12);
          if (reward > 0.78) items.push({ z: z + 280, lane: safe, kind: "sun" });
          else if (reward > 0.42) items.push({ z: z + 280, lane: safe, kind: "coin" });
          advance = 600 + Math.floor(hash(z + 19) * 120);
        } else {
          items.push({ z, lane: laneA, kind: "bat" });
          const kind = hash(z + 12) > 0.66 ? "sun" : "coin";
          const pickupLane = hash(z + 14) > 0.55 ? safe : laneB;
          items.push({ z: z + 30, lane: pickupLane, kind });
          advance = 560 + Math.floor(hash(z + 19) * 110);
        }
      } else if (pattern === "pair") {
        const lane = Math.floor(hash(z + 3) * 3);
        items.push({ z, lane, kind: "coin" });
        items.push({ z: z + 240, lane, kind: "coin" });
        advance = 640 + Math.floor(hash(z + 19) * 100);
      } else {
        const lane = Math.floor(hash(z + 3) * 3);
        items.push({ z, lane, kind: "bat" });
        items.push({ z: z + 30, lane: (lane + 1 + Math.floor(hash(z + 7) * 2)) % 3, kind: hash(z + 12) > 0.7 ? "sun" : "coin" });
        advance = 500 + Math.floor(hash(z + 19) * 110);
      }
      return { items, advance };
    }

    function countAhead() {
      const near = cameraZ + 30;
      const far = cameraZ + VIEW_Z;
      let n = 0;
      for (const item of entities) {
        if (!item.got && item.z > near && item.z < far) n += 1;
      }
      return n;
    }

    function spawn() {
      while (nextZ < cameraZ + VIEW_Z - 40 || (countAhead() < MIN_ON_SCREEN && nextZ < cameraZ + VIEW_Z + 280)) {
        const chunk = beat(Math.round(nextZ), countAhead() < MIN_ON_SCREEN);
        chunk.items.forEach((item) => entities.push({ ...item, hit: false, got: false }));
        nextZ += chunk.advance;
      }
    }

    function sameLane(item) {
      return Math.abs(playerNx - LANES[item.lane]) < 0.3;
    }

    function update(dt) {
      speedMul += (1 - speedMul) * Math.min(1, dt * 1.7);
      cameraZ += SPEED * speedScale * speedMul * dt;
      runPhase += dt * 10;
      if (invuln > 0) invuln -= dt;
      playerNx += (LANES[lane] - playerNx) * Math.min(1, dt * 9);
      spawn();
      entities.forEach((item) => {
        const rel = item.z - cameraZ;
        if (item.kind === "bat") {
          if (item.hit || invuln > 0) return;
          if (rel < PLAYER_Z + 26 && rel > PLAYER_Z - 22 && sameLane(item)) {
            item.hit = true;
            hits += 1;
            invuln = 0.75;
            speedMul = 0.35;
          }
          return;
        }
        if (item.got) return;
        if (rel < PLAYER_Z + 34 && rel > PLAYER_Z - 18 && sameLane(item)) {
          item.got = true;
          if (item.kind === "coin") coins += 1;
          else suns += 1;
        }
      });
      entities = entities.filter((item) => item.z > cameraZ - 160);
      clouds.forEach((cloud) => {
        cloud.x += dt * 0.012 * cloud.s;
        if (cloud.x > 1.15) cloud.x = -0.15;
      });
    }

    function quad(n0, z0, n1, z1) {
      const a = project(n0, z0);
      const b = project(n1, z0);
      const c = project(n1, z1);
      const d = project(n0, z1);
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.lineTo(c.x, c.y);
      ctx.lineTo(d.x, d.y);
      ctx.closePath();
    }

    function fillQuad(n0, z0, n1, z1, color) {
      ctx.fillStyle = color;
      quad(n0, z0, n1, z1);
      ctx.fill();
    }

    function drawSky() {
      const sky = ctx.createLinearGradient(0, 0, 0, horizonY);
      sky.addColorStop(0, "#79c0ef");
      sky.addColorStop(0.62, "#d7eefb");
      sky.addColorStop(1, "#f6d7b0");
      ctx.fillStyle = sky;
      ctx.fillRect(0, 0, width, horizonY + 2);
      ctx.fillStyle = "rgba(255, 244, 207, 0.45)";
      ctx.beginPath();
      ctx.arc(width * 0.8, horizonY * 0.42, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#fff6d4";
      ctx.beginPath();
      ctx.arc(width * 0.8, horizonY * 0.42, 24, 0, Math.PI * 2);
      ctx.fill();
      clouds.forEach((cloud) => {
        const x = cloud.x * width;
        const y = horizonY * cloud.y;
        ctx.fillStyle = "rgba(255,255,255,0.85)";
        ctx.beginPath();
        ctx.ellipse(x, y, cloud.r, cloud.r * 0.62, 0, 0, Math.PI * 2);
        ctx.ellipse(x + cloud.r * 0.65, y + 3, cloud.r * 0.7, cloud.r * 0.46, 0, 0, Math.PI * 2);
        ctx.fill();
      });
      drawPeaks("#c5d5ce", 0.7, [0.08, 0.72, 0.18, 0.3, 0.3, 0.9, 0.46, 0.34, 0.62, 0.8, 0.78, 0.28, 0.94, 0.7]);
      drawPeaks("#a9c3ae", 1, [0.04, 0.4, 0.16, 0.75, 0.28, 0.22, 0.42, 0.85, 0.58, 0.3, 0.74, 0.7, 0.9, 0.26]);
    }

    function drawPeaks(color, scale, pairs) {
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.moveTo(0, horizonY);
      for (let i = 0; i < pairs.length; i += 2) {
        ctx.lineTo(pairs[i] * width, horizonY - pairs[i + 1] * 70 * scale);
      }
      ctx.lineTo(width, horizonY);
      ctx.closePath();
      ctx.fill();
    }

    function drawRoad() {
      ctx.fillStyle = "#d7e7c4";
      ctx.fillRect(0, horizonY, width, height - horizonY);
      const n0 = Math.floor(cameraZ / SEG);
      const n1 = Math.floor((cameraZ + VIEW_Z) / SEG);
      const props = [];
      for (let n = n1; n >= n0; n--) {
        const nearEdge = n * SEG - cameraZ;
        const farEdge = nearEdge + SEG;
        if (farEdge <= 1) continue;
        const z0 = Math.max(nearEdge, 1);
        const z1 = farEdge;
        const s = project(0, z0).s;
        const grass = mod(n, 2) === 0 ? "#5eaf54" : "#56a64c";
        const road = mod(n, 2) === 0 ? "#68717e" : "#636b78";
        const rumble = mod(n, 2) === 0 ? "#f4f1ea" : "#e15a42";
        fillQuad(-3.2, z0, 3.2, z1, grass);
        fillQuad(-1, z0, 1, z1, road);
        fillQuad(-1.1, z0, -1, z1, rumble);
        fillQuad(1, z0, 1.1, z1, rumble);
        if (mod(n, 2) === 0) {
          const a = Math.max(z0, nearEdge + SEG * 0.18);
          const b = Math.min(z1, nearEdge + SEG * 0.62);
          if (b > a) {
            ctx.fillStyle = "#f7f5f0";
            LANES.forEach((nx) => {
              quad(nx - 0.055, a, nx + 0.055, b);
              ctx.fill();
            });
          }
        }
        const propZ = nearEdge + SEG * 0.62;
        if (propZ > 10 && propZ < VIEW_Z) {
          if (mod(n, 5) === 0) props.push({ z: propZ, nx: -1.55, kind: "tree", n });
          if (mod(n, 4) === 2) props.push({ z: propZ, nx: 1.48, kind: "tree", n: n + 2 });
          if (mod(n, 3) === 0) props.push({ z: propZ, nx: n % 2 === 0 ? -1.18 : 1.18, kind: "lamp", n });
          if (mod(n, 6) === 0) props.push({ z: propZ, nx: n % 12 === 0 ? -2.05 : 2.05, kind: "building", n });
        }
      }
      return props;
    }

    function drawTree(p, seed) {
      const tall = 0.85 + hash(seed) * 0.4;
      const canopy = (28 + hash(seed + 2) * 14) * tall * p.s;
      const trunkH = 32 * tall * p.s;
      ctx.fillStyle = "#8d5a38";
      ctx.fillRect(p.x - 4 * p.s, p.y - trunkH, 8 * p.s, trunkH);
      ctx.fillStyle = hash(seed) > 0.5 ? "#2f8f4a" : "#3e9d55";
      ctx.beginPath();
      ctx.arc(p.x, p.y - trunkH - canopy * 0.2, canopy, 0, Math.PI * 2);
      ctx.arc(p.x - canopy * 0.4, p.y - trunkH, canopy * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawLamp(p) {
      ctx.fillStyle = "#4d5966";
      ctx.fillRect(p.x - 2 * p.s, p.y - 110 * p.s, 4 * p.s, 110 * p.s);
      ctx.fillStyle = "#fff1a8";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y - 110 * p.s, 9 * p.s, 5 * p.s, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawBuilding(p, seed) {
      const floors = 2 + Math.floor(hash(seed) * 3);
      const bw = (46 + hash(seed + 3) * 24) * p.s;
      const bh = (30 + floors * 24) * p.s;
      const colors = ["#e0a07a", "#f0c98a", "#8fb8c9", "#d9898a"];
      ctx.fillStyle = colors[Math.abs(seed) % colors.length];
      ctx.fillRect(p.x - bw / 2, p.y - bh, bw, bh);
      ctx.fillStyle = "#6f5a52";
      ctx.fillRect(p.x - bw * 0.55, p.y - bh - 7 * p.s, bw * 1.1, 7 * p.s);
    }

    function drawProp(prop) {
      const p = project(prop.nx, prop.z);
      if (prop.kind === "tree") drawTree(p, prop.n);
      else if (prop.kind === "lamp") drawLamp(p);
      else drawBuilding(p, prop.n);
    }

    function drawSprite(item) {
      const rel = item.z - cameraZ;
      if (rel < 8 || rel > VIEW_Z || item.got) return;
      const p = project(LANES[item.lane], rel);
      const img = art[item.kind];
      const full = SIZE[item.kind];
      const h = full * p.s;
      ctx.fillStyle = "rgba(30, 24, 20, 0.18)";
      ctx.beginPath();
      ctx.ellipse(p.x, p.y, h * 0.28, h * 0.08, 0, 0, Math.PI * 2);
      ctx.fill();
      if (!img.complete || !img.naturalWidth) return;
      const w = h * (img.naturalWidth / img.naturalHeight);
      ctx.drawImage(img, p.x - w / 2, p.y - h, w, h);
    }

    function drawPin(p, h) {
      const s = h / 420;
      const x = p.x;
      const y = p.y;
      const headR = 18 * s;
      const headY = y - 22 * s - headR;
      ctx.fillStyle = "rgba(255, 214, 70, 0.75)";
      ctx.beginPath();
      ctx.ellipse(x, y, 14 * s, 5 * s, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#e25b2a";
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x - 7 * s, headY + headR * 0.7);
      ctx.lineTo(x + 7 * s, headY + headR * 0.7);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, headY, headR + 3 * s, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#f7f4ef";
      ctx.beginPath();
      ctx.arc(x, headY, headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(x, headY, headR - 1.2 * s, 0, Math.PI * 2);
      ctx.clip();
      ctx.fillStyle = "#7ec8c6";
      ctx.fillRect(x - headR, headY + headR * 0.4, headR * 2, headR);
      ctx.fillStyle = "#e0a06a";
      ctx.beginPath();
      ctx.arc(x, headY - headR * 0.02, headR * 0.68, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = "#5c3318";
      ctx.beginPath();
      ctx.arc(x, headY - headR * 0.18, headR * 0.6, Math.PI, 0);
      ctx.fill();
      ctx.restore();
      if (invuln > 0 && Math.sin(invuln * 46) > 0) {
        ctx.fillStyle = "rgba(255,255,255,0.45)";
        ctx.beginPath();
        ctx.arc(x, headY, headR + 3 * s, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function drawPanel(mode, originY, panelH) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(0, originY, stageW, panelH);
      ctx.clip();
      ctx.translate(0, originY);
      viewMode = mode;
      width = stageW;
      height = panelH;
      horizonY = height * 0.28;
      groundY = height;
      drawSky();
      const savedZ = cameraZ;
      cameraZ = 0;
      viewMode = "world";
      const props = drawRoad();
      props.sort((a, b) => b.z - a.z);
      props.forEach((prop) => drawProp(prop));
      cameraZ = savedZ;
      viewMode = mode;
      const sprites = entities.map((item) => ({ z: item.z - cameraZ, draw: () => drawSprite(item) }));
      sprites.sort((a, b) => b.z - a.z);
      if (mode === "screen") {
        sprites.forEach((sprite) => sprite.draw());
        viewMode = "world";
        drawPin(project(playerNx, PLAYER_Z), height);
        viewMode = "screen";
      } else {
        sprites.forEach((sprite) => {
          if (sprite.z > PLAYER_Z) sprite.draw();
        });
        drawPin(project(playerNx, PLAYER_Z), height);
        sprites.forEach((sprite) => {
          if (sprite.z <= PLAYER_Z) sprite.draw();
        });
      }
      if (invuln > 0.45) {
        ctx.fillStyle = "rgba(210, 64, 48, " + ((invuln - 0.45) * 0.28) + ")";
        ctx.fillRect(0, 0, width, height);
      }
      ctx.fillStyle = "rgba(20, 28, 32, 0.58)";
      const label = mode === "screen" ? "Screen spawn" : "Horizon spawn";
      ctx.font = "700 14px Segoe UI, system-ui, sans-serif";
      const tw = ctx.measureText(label).width;
      const lx = width - tw - 28;
      roundLabel(lx, 14, tw + 20, 26);
      ctx.fillStyle = "white";
      ctx.fillText(label, lx + 10, 32);
      ctx.restore();
    }

    function roundLabel(x, y, w, h) {
      ctx.beginPath();
      ctx.moveTo(x + 13, y);
      ctx.arcTo(x + w, y, x + w, y + h, 13);
      ctx.arcTo(x + w, y + h, x, y + h, 13);
      ctx.arcTo(x, y + h, x, y, 13);
      ctx.arcTo(x, y, x + w, y, 13);
      ctx.closePath();
      ctx.fill();
    }

    function draw() {
      const gap = 8;
      const panelH = (stageH - gap) / 2;
      ctx.fillStyle = "#12171c";
      ctx.fillRect(0, 0, stageW, stageH);
      drawPanel("screen", 0, panelH);
      drawPanel("world", panelH + gap, panelH);
      document.getElementById("distance").textContent = Math.floor(cameraZ / 18) + " m";
      document.getElementById("haul").textContent = "Coins " + coins + " · Suns " + suns;
      document.getElementById("bumps").textContent = "Bumps " + hits;
    }

    let last = performance.now();
    function frame(now) {
      const dt = Math.min(0.033, (now - last) / 1000);
      last = now;
      if (canvas.clientWidth !== stageW || canvas.clientHeight !== stageH) resize();
      update(dt);
      draw();
      requestAnimationFrame(frame);
    }

    window.addEventListener("keydown", (event) => {
      if (event.repeat) return;
      if (event.key === "ArrowLeft" || event.key === "a" || event.key === "A") {
        lane = Math.max(0, lane - 1);
        event.preventDefault();
      } else if (event.key === "ArrowRight" || event.key === "d" || event.key === "D") {
        lane = Math.min(2, lane + 1);
        event.preventDefault();
      }
    });
    document.getElementById("speed").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;
      speedScale = Number(button.dataset.speed);
      document.querySelectorAll("#speed button").forEach((el) => {
        el.classList.toggle("on", el === button);
      });
    });
    canvas.addEventListener("pointerdown", (event) => {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      if (x < rect.width * 0.5) lane = Math.max(0, lane - 1);
      else lane = Math.min(2, lane + 1);
    });

    window.__demo = {
      state: () => ({ cameraZ, lane, playerNx, hits, coins, suns, entities: entities.length, speedMul }),
    };

    const params = new URLSearchParams(location.search);
    if (params.has("t")) cameraZ = SPEED * Number(params.get("t"));

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
